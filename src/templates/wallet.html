{% extends 'base.html' %}

{% block title %}Wallet & Payouts - UWA SecondHand{% endblock %}

{% block content %}
<div class="wallet-page-container">
    <div class="page-header">
        <div class="header-content">
            <h1>Wallet & Payouts</h1>
            <p class="page-subtitle">Manage your balance, linked cards, top-ups, and withdrawals</p>
        </div>
        <a href="{{ url_for('dashboard_page') }}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>

    {% include 'partials/wallet_workspace.html' %}
</div>

<style>
    .wallet-page-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 40px;
        gap: 20px;
    }

    .header-content h1 {
        margin: 0 0 8px 0;
        font-size: 2em;
    }

    .page-subtitle {
        margin: 0;
        color: var(--text-secondary);
        font-size: 1.05em;
    }

    .page-header .btn {
        white-space: nowrap;
        flex-shrink: 0;
    }

    @media (max-width: 600px) {
        .page-header {
            flex-direction: column;
            gap: 15px;
        }

        .page-header .btn {
            width: 100%;
        }
    }
</style>
{% endblock %}
